<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f4efe8"/>

  <!-- Decorative concentric circles -->
  <circle cx="600" cy="250" r="380" stroke="#ddd0c0" stroke-width="1" fill="none" opacity="0.35"/>
  <circle cx="600" cy="250" r="300" stroke="#ddd0c0" stroke-width="1" fill="none" opacity="0.25"/>
  <circle cx="600" cy="250" r="220" stroke="#ddd0c0" stroke-width="1" fill="none" opacity="0.18"/>
  <circle cx="600" cy="250" r="140" stroke="#ddd0c0" stroke-width="1" fill="none" opacity="0.12"/>

  <!-- Logo icon (large) -->
  <defs>
    <radialGradient id="og-g" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffd8c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b85a30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="440" cy="240" r="105" stroke="#ddd0c0" stroke-width="4" fill="none"/>
  <circle cx="440" cy="240" r="70" stroke="#b85a30" stroke-width="6" fill="none"/>
  <circle cx="440" cy="240" r="32" fill="#b85a30"/>
  <circle cx="440" cy="240" r="32" fill="url(#og-g)"/>

  <!-- Logo wordmark (large) -->
  <text x="575" y="248" font-family="Fraunces, serif" font-weight="400" font-size="72" fill="#2a2018" letter-spacing="-1.5">
    <tspan font-weight="700">I</tspan>nner<tspan font-weight="700">L</tspan>oop
  </text>
  <text x="579" y="300" font-family="DM Sans, sans-serif" font-weight="300" font-size="30" fill="#b85a30" letter-spacing="10">STUDIO</text>

  <!-- Tagline (large) -->
  <text x="600" y="440" font-family="Fraunces, serif" font-weight="300" font-style="italic" font-size="52" fill="#6a5840" text-anchor="middle">Something is coming.</text>

  <!-- Bottom URL -->
  <text x="600" y="580" font-family="DM Sans, sans-serif" font-weight="300" font-size="18" fill="#b0a090" text-anchor="middle" letter-spacing="4">innerloop.studio</text>
</svg>
