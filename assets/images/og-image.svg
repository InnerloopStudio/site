<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f4efe8"/>

  <!-- Decorative concentric circles -->
  <circle cx="600" cy="280" r="260" stroke="#ddd0c0" stroke-width="1" fill="none" opacity="0.5"/>
  <circle cx="600" cy="280" r="200" stroke="#ddd0c0" stroke-width="1" fill="none" opacity="0.4"/>
  <circle cx="600" cy="280" r="140" stroke="#ddd0c0" stroke-width="1" fill="none" opacity="0.3"/>
  <circle cx="600" cy="280" r="80" stroke="#ddd0c0" stroke-width="1" fill="none" opacity="0.2"/>

  <!-- Logo wordmark at ~2x scale -->
  <defs>
    <radialGradient id="og-g" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffd8c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b85a30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="520" cy="260" r="70" stroke="#ddd0c0" stroke-width="3" fill="none"/>
  <circle cx="520" cy="260" r="46" stroke="#b85a30" stroke-width="4" fill="none"/>
  <circle cx="520" cy="260" r="20" fill="#b85a30"/>
  <circle cx="520" cy="260" r="20" fill="url(#og-g)"/>
  <text x="620" y="252" font-family="Fraunces, serif" font-weight="400" font-size="40" fill="#2a2018" letter-spacing="-1">
    <tspan font-weight="600">I</tspan>nner<tspan font-weight="600">L</tspan>oop
  </text>
  <text x="622" y="292" font-family="DM Sans, sans-serif" font-weight="300" font-size="22" fill="#b85a30" letter-spacing="8">STUDIO</text>

  <!-- Tagline -->
  <text x="600" y="400" font-family="Fraunces, serif" font-weight="300" font-style="italic" font-size="28" fill="#6a5840" text-anchor="middle">Something is coming.</text>

  <!-- Bottom URL -->
  <text x="600" y="570" font-family="DM Sans, sans-serif" font-weight="300" font-size="16" fill="#b0a090" text-anchor="middle" letter-spacing="4">innerloop.studio</text>
</svg>